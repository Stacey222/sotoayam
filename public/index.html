<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sotoayam</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Sotoayam</p>
        <h1>Automation Control</h1>
        <p class="subtitle">Kelola onboarding, Divisi, role bisnis, dan status akses pengguna.</p>
      </div>
      <button id="admin-key-button" class="secondary" type="button">Admin Key</button>
    </header>
    <main>
      <section class="toolbar" aria-label="Filter pengguna">
        <div class="filters" role="group">
          <button class="filter active" data-status="pending" type="button">Pending Users</button>
          <button class="filter" data-status="active" type="button">Active Users</button>
          <button class="filter" data-status="inactive" type="button">Inactive Users</button>
        </div>
        <button id="refresh" class="secondary" type="button">Muat Ulang</button>
      </section>
      <p id="notice" class="notice" hidden></p>
      <section class="table-card">
        <table>
          <thead><tr><th>Display Name</th><th>Telegram Connected</th><th>Divisi</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="user-rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>Belum ada pengguna pada filter ini.</div>
      </section>
    </main>
    <dialog id="editor">
      <form id="edit-form">
        <div class="dialog-heading">
          <div><p class="eyebrow">IT USER MANAGEMENT</p><h2>Pengaturan Akses</h2></div>
          <button id="close-dialog" class="icon-button" type="button" aria-label="Tutup">&times;</button>
        </div>
        <input id="user-id" type="hidden" />
        <label>Display Name<input id="display-name" readonly /></label>
        <label>Telegram Connected<input id="telegram-connected" readonly /></label>
        <div class="form-grid">
          <label>Divisi<select id="division"></select></label>
          <label>Role<select id="role"></select></label>
        </div>
        <label class="switch-row"><input id="active" type="checkbox" /><span>Status Aktif</span></label>
        <div class="actions"><button id="cancel" class="secondary" type="button">Batal</button><button type="submit">Simpan</button></div>
      </form>
    </dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
